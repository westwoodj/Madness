[package]
name = "madness"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "madness"
path = "src/main.rs"

[dependencies]
rusqlite          = { version = "0.31", features = ["bundled"] }
ratatui           = "0.28"
crossterm         = "0.28"
reqwest           = { version = "0.12", features = ["json", "blocking"] }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
toml              = "0.8"
chrono            = { version = "0.4", features = ["serde"] }
anyhow            = "1.0"
clap              = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 3
